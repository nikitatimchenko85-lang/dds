<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ДДС</title>
<style>
  :root{
    --bg:#0a0a0c;
    --card:#ffffff;
    --card-dark:#15161b;
    --border:#e6e6ec;
    --text:#15161b;
    --muted:#8b8f9c;
    --income:#1fae63;
    --expense:#e2483d;
    --transfer:#3d6ae2;
    --transfer-soft:#eef1fb;
    --accent:#3d6ae2;
    --radius-sm:14px;
    --shadow:0 1px 2px rgba(20,20,30,.05), 0 8px 20px rgba(20,20,30,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
  }
  button, input, select, textarea{ font-family:inherit; }
  button{ cursor:pointer; }

  /* ---------- Верхний светлый блок ---------- */
  .top-panel{
    background:var(--card); border-radius:0 0 26px 26px; padding:16px 16px 16px;
    position:sticky; top:0; z-index:5;
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .employee-display{font-size:17px; font-weight:700; padding:2px 0; cursor:pointer;}
  .employee-display .hint{font-size:11px; color:var(--muted); font-weight:400; display:block; margin-top:1px;}
  .refresh-btn{background:var(--bg); border:none; color:#fff; font-size:12px; padding:7px 12px; border-radius:999px;}
  .sync-meta{font-size:11px; color:var(--muted); margin-top:6px;}

  .wallet-strip{display:flex; gap:10px; overflow-x:auto; padding:12px 2px 0; -webkit-overflow-scrolling:touch;}
  .wallet-strip::-webkit-scrollbar{display:none;}
  .wallet-chip{
    flex:0 0 auto; background:var(--bg); border:2px solid transparent; border-radius:var(--radius-sm); padding:10px 16px;
  }
  .wallet-chip.selected{ border-color:var(--accent); }
  .wallet-chip .wname{font-size:13px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px;}

  /* ---------- Чёрная зона Приход/Перевод/Расход ---------- */
  .type-zone{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:16px 16px 26px; background:var(--bg);
  }
  .type-btn{
    flex:1; max-width:150px; padding:13px 8px; border-radius:999px; border:none;
    background:rgba(255,255,255,.08); color:rgba(255,255,255,.6); font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .type-btn.income.active{background:var(--income); color:#fff;}
  .type-btn.expense.active{background:var(--expense); color:#fff;}
  .type-btn.transfer{
    flex:0 0 auto; width:46px; height:46px; border-radius:50%; background:#fff; color:var(--card-dark);
    font-size:17px; margin-top:-30px; box-shadow:0 6px 16px rgba(0,0,0,.45); border:5px solid var(--bg);
  }
  .type-btn.transfer.active{background:var(--transfer); color:#fff;}

  /* ---------- Нижний светлый блок ---------- */
  .content-panel{
    background:var(--card); border-radius:26px 26px 0 0; padding:16px 16px 24px; min-height:60vh;
  }

  .tabs{display:flex; gap:8px; background:var(--bg); border-radius:999px; padding:5px; margin-bottom:18px;}
  .tab-btn{flex:1; padding:11px; border-radius:999px; border:none; background:transparent; color:rgba(255,255,255,.55); font-size:13px; font-weight:700;}
  .tab-btn.active{background:#fff; color:var(--text);}

  .field-float{position:relative; margin-bottom:14px;}
  .field-float input, .field-float textarea{
    width:100%; padding:19px 14px 9px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:16px;
  }
  .field-float textarea{min-height:58px; resize:vertical; font-family:inherit;}
  .field-float label{
    position:absolute; left:15px; top:19px; font-size:15px; color:var(--muted); pointer-events:none;
  }
  .field-float label .req{color:var(--expense); margin-left:2px;}
  .field-float input:focus + label, .field-float input:not(:placeholder-shown) + label,
  .field-float textarea:focus + label, .field-float textarea:not(:placeholder-shown) + label{
    top:7px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;
  }

  .plain-field{margin-bottom:14px; position:relative;}
  select{
    width:100%; padding:14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:16px; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b8f9c' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center;
  }
  select:disabled{opacity:.55;}

  .autocomplete-list{
    position:absolute; left:0; right:0; top:100%; background:var(--card); border:1px solid var(--border);
    border-radius:12px; margin-top:4px; max-height:200px; overflow-y:auto; z-index:20; box-shadow:var(--shadow);
    display:none;
  }
  .autocomplete-list.show{display:block;}
  .autocomplete-item{padding:12px 14px; font-size:15px; border-bottom:1px solid var(--border);}
  .autocomplete-item:last-child{border-bottom:none;}

  .amount-row{display:flex; gap:8px; margin-bottom:14px;}
  .currency-pill{
    flex:0 0 auto; background:var(--card-dark); color:#fff; border:none; border-radius:12px;
    padding:0 16px; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .currency-pill:disabled{opacity:.4;}
  .amount-input{flex:1; font-size:26px; font-weight:800; text-align:center; border-radius:12px; border:1px solid var(--border); background:var(--card); padding:14px; width:100%;}

  .transfer-row{display:flex; align-items:center; gap:8px;}
  .transfer-row .plain-field{flex:1; margin-bottom:0;}
  .transfer-arrow{color:var(--muted); font-size:18px;}

  .photo-field{display:flex; gap:10px;}
  .photo-btn{
    flex:1; padding:16px 8px; border-radius:12px; border:1.5px dashed var(--border);
    background:var(--card); color:var(--muted); font-size:14px; font-weight:600;
  }
  .photo-preview{position:relative; width:100%;}
  .photo-preview img{width:100%; border-radius:12px; display:block; max-height:220px; object-fit:cover;}
  .photo-remove{
    position:absolute; top:8px; right:8px; background:rgba(0,0,0,.55); color:#fff; border:none;
    border-radius:50%; width:30px; height:30px; font-size:16px;
  }

  .submit-btn{
    width:100%; padding:16px; border:none; border-radius:999px; font-size:16px; font-weight:800;
    color:#fff; margin-top:6px;
  }
  .submit-btn.income{background:var(--income);}
  .submit-btn.expense{background:var(--expense);}
  .submit-btn.transfer{background:var(--transfer);}
  .submit-btn:disabled{opacity:.5;}

  .sync-status{font-size:12px; text-align:center; margin-top:8px; color:var(--muted); min-height:16px;}
  .sync-status.pending{color:#c98a1f;}
  .sync-status.error{color:var(--expense);}
  .sync-status.ok{color:var(--income);}

  .section-title{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:4px 0 10px; display:flex; justify-content:space-between; align-items:center;}
  .section-title button{background:none; border:none; color:var(--accent); font-size:12px; padding:0;}

  .entry{
    background:var(--bg); border-radius:14px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; gap:10px;
  }
  .entry .stripe{width:4px; align-self:stretch; border-radius:2px;}
  .entry.income .stripe{background:var(--income);}
  .entry.expense .stripe{background:var(--expense);}
  .entry .info{flex:1; min-width:0;}
  .entry .title{font-size:14px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .entry .cat{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .entry .meta{font-size:11px; color:var(--muted); margin-top:2px;}
  .entry .amount{font-size:15px; font-weight:800; white-space:nowrap;}
  .entry.income .amount{color:var(--income);}
  .entry.expense .amount{color:var(--expense);}
  .entry .dot{width:6px; height:6px; border-radius:50%; display:inline-block; margin-left:4px;}
  .entry .dot.pending{background:#e0a63c;}
  .entry .dot.error{background:var(--expense);}

  .empty{text-align:center; color:var(--muted); font-size:14px; padding:30px 0;}

  .camera-overlay{position:fixed; inset:0; background:#000; z-index:100; display:none; flex-direction:column;}
  .camera-overlay video{flex:1; width:100%; object-fit:cover; background:#000;}
  .camera-controls{position:absolute; top:0; left:0; right:0; padding:16px; display:flex; justify-content:space-between; z-index:2;}
  .camera-controls button{background:rgba(0,0,0,.5); color:#fff; border:none; border-radius:50%; width:42px; height:42px; font-size:18px;}
  .camera-shutter-row{position:absolute; bottom:26px; left:0; right:0; display:flex; justify-content:center; z-index:2;}
  .shutter{width:70px; height:70px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,.4);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(10,10,12,.6); z-index:90; display:none; align-items:flex-end;}
  .modal{background:var(--card); width:100%; border-radius:22px 22px 0 0; padding:18px 16px 26px; max-height:85vh; overflow:auto;}
  .modal h3{margin:0 0 14px;}
  .modal p{margin:0; font-size:14px; color:var(--muted);}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions button{flex:1; padding:13px; border-radius:10px; border:none; font-size:14px; font-weight:700;}
  .btn-cancel{background:var(--bg); color:#fff;}
  .btn-save{background:var(--accent); color:#fff;}
  .btn-delete{background:var(--expense); color:#fff;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card-dark);
    color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:200;
  }
</style>
</head>
<body>

<div class="top-panel">
  <div class="header-top">
    <div class="employee-display" id="employeeDisplay">Сотрудник</div>
    <button class="refresh-btn" id="btnRefresh">Обновить</button>
  </div>
  <div class="sync-meta" id="syncMeta">Загрузка...</div>
  <div class="wallet-strip" id="walletStrip"></div>
</div>

<div class="type-zone">
  <button class="type-btn income active" id="btnIncome">↓ Приход</button>
  <button class="type-btn transfer" id="btnTransfer">⇄</button>
  <button class="type-btn expense" id="btnExpense">Расход ↑</button>
</div>

<div class="content-panel">

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnAdd">Добавить</button>
    <button class="tab-btn" id="tabBtnEntries">Записи</button>
  </div>

  <div id="tabAdd">
    <div id="normalFields">
      <div class="field-float">
        <input type="text" id="title" placeholder=" " enterkeyhint="next">
        <label for="title">Наименование<span class="req">*</span></label>
      </div>
      <div class="plain-field">
        <input type="text" id="categoryInput" placeholder="Статья" autocomplete="off">
        <div class="autocomplete-list" id="categorySuggestions"></div>
      </div>
    </div>

    <div id="transferFields" style="display:none;">
      <div class="transfer-row">
        <div class="plain-field">
          <select id="transferFrom"></select>
        </div>
        <div class="transfer-arrow">→</div>
        <div class="plain-field">
          <select id="transferTo"></select>
        </div>
      </div>
    </div>

    <div class="amount-row">
      <button type="button" class="currency-pill" id="currencyPill">₽ RUB</button>
      <input type="number" inputmode="decimal" id="amount" class="amount-input" placeholder="0" enterkeyhint="done">
    </div>

    <div class="field-float">
      <textarea id="comment" placeholder=" "></textarea>
      <label for="comment">Комментарий</label>
    </div>

    <div class="plain-field" id="photoFieldWrapper">
      <div id="photoArea">
        <div class="photo-field">
          <button type="button" class="photo-btn" id="btnCamera">Камера</button>
          <button type="button" class="photo-btn" id="btnGallery">Галерея</button>
        </div>
      </div>
      <input type="file" id="galleryInput" accept="image/*" style="display:none">
    </div>

    <button class="submit-btn income" id="btnSubmit">Добавить приход</button>
    <div class="sync-status" id="syncStatus"></div>
  </div>

  <div id="tabEntries" style="display:none;">
    <div class="section-title">
      <span>Последние записи</span>
      <button id="btnRetry" style="display:none;">Повторить отправку</button>
    </div>
    <div id="entriesList"></div>
  </div>

</div>

<div class="camera-overlay" id="cameraOverlay">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="camera-controls">
    <button id="btnCameraClose">✕</button>
    <button id="btnCameraSwitch">⟳</button>
  </div>
  <div class="camera-shutter-row">
    <button class="shutter" id="btnShutter"></button>
  </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<div id="editModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3>Редактировать запись</h3>
    <div class="plain-field">
      <select id="editType">
        <option value="income">Приход</option>
        <option value="expense">Расход</option>
      </select>
    </div>
    <div class="field-float">
      <input type="text" id="editTitle" placeholder=" ">
      <label for="editTitle">Наименование</label>
    </div>
    <div class="plain-field">
      <input type="text" id="editCategoryInput" placeholder="Статья" autocomplete="off">
      <div class="autocomplete-list" id="editCategorySuggestions"></div>
    </div>
    <div class="plain-field">
      <select id="editWallet"></select>
    </div>
    <div class="amount-row">
      <button type="button" class="currency-pill" id="editCurrencyPill">₽ RUB</button>
      <input type="number" id="editAmount" class="amount-input">
    </div>
    <div class="field-float">
      <textarea id="editComment" placeholder=" "></textarea>
      <label for="editComment">Комментарий</label>
    </div>
    <div class="plain-field">
      <div id="editPhotoArea"></div>
      <input type="file" id="editGalleryInput" accept="image/*" style="display:none">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnEditCancel">Отмена</button>
      <button class="btn-delete" id="btnEditDelete">Удалить</button>
      <button class="btn-save" id="btnEditSave">Сохранить</button>
    </div>
  </div>
</div>

<div id="confirmDeleteBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3>Удалить запись?</h3>
    <p id="confirmDeleteText">Это действие нельзя отменить.</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnConfirmDeleteCancel">Отмена</button>
      <button class="btn-delete" id="btnConfirmDeleteOk">Удалить</button>
    </div>
  </div>
</div>

<div id="employeeBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="employeeModalTitle">Как вас зовут?</h3>
    <div class="plain-field" style="margin-top:14px;">
      <input type="text" id="employeeNameInput" placeholder="Имя сотрудника" style="width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--card); font-size:16px;">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnEmployeeCancel" style="display:none;">Отмена</button>
      <button class="btn-save" id="btnEmployeeSave">Сохранить</button>
    </div>
  </div>
</div>

<script>
/* ======================= НАСТРОЙКИ ======================= */

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcGRHM_6KHUJoySM4dU0xkfSzoWKZH7D9JVt987ollOwQl7wz0T8wlEGIk1sYSifM/exec";
const API_TOKEN = "HpR5SMj11iYfuh6apsMQETU-JOOhCkg3";
const UNCONFIRMED_TIMEOUT_MS = 90000;
const REFRESH_INTERVAL_MS = 30000;

const DEFAULT_CATEGORIES = {
  income: ["Продажа билетов", "Аренда зала", "Кейтеринг", "Прочие доходы"],
  expense: ["Аренда", "Зарплата", "Коммунальные услуги", "Закупки", "Реклама", "Транспорт", "Прочее"]
};
const DEFAULT_WALLETS = [{ name: "Касса", currency: "RUB" }];
const CURRENCIES = ["RUB", "USD", "EUR", "THB"];
const CURRENCY_SYMBOLS = { RUB:"₽", USD:"$", EUR:"€", THB:"฿" };
function currencySymbol(code){ return CURRENCY_SYMBOLS[code] || code || ""; }

/* ============================================================================ */

const EMPLOYEE_KEY = "dds_employee_name";
const WALLET_KEY = "dds_selected_wallet";

const state = {
  type: "income",
  photo: null,
  entries: [],
  categories: null,
  wallets: null,
  selectedWallet: null,
  manualCurrency: null,
  employeeName: "",
  editingId: null,
  deletingId: null,
  facingMode: "environment",
  stream: null,
  refreshing: false,
  pendingStatusEntryId: null,
  totalCount: null
};

const el = id => document.getElementById(id);

function currentCategories(){ return state.categories || DEFAULT_CATEGORIES; }
function currentWallets(){ return state.wallets || DEFAULT_WALLETS; }

function fillWalletOptions(select){
  select.innerHTML = currentWallets().map(w=>
    `<option value="${escapeHtml(w.name)}">${escapeHtml(w.name)}</option>`
  ).join("");
}

/* ---------- Автодополнение статей ---------- */

function setupAutocomplete(inputEl, listEl, getOptions){
  function render(){
    const q = inputEl.value.trim().toLowerCase();
    const options = getOptions();
    const filtered = q ? options.filter(o=> o.toLowerCase().includes(q)) : options;
    if(filtered.length === 0){ listEl.classList.remove("show"); listEl.innerHTML=""; return; }
    listEl.innerHTML = filtered.map(o=> `<div class="autocomplete-item" data-value="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join("");
    listEl.classList.add("show");
    listEl.querySelectorAll(".autocomplete-item").forEach(item=>{
      item.onmousedown = (e)=> e.preventDefault();
      item.onclick = ()=>{ inputEl.value = item.getAttribute("data-value"); listEl.classList.remove("show"); };
    });
  }
  inputEl.addEventListener("input", render);
  inputEl.addEventListener("focus", render);
  inputEl.addEventListener("blur", ()=> setTimeout(()=> listEl.classList.remove("show"), 150));
}
setupAutocomplete(el("categoryInput"), el("categorySuggestions"), ()=> currentCategories()[state.type] || []);
setupAutocomplete(el("editCategoryInput"), el("editCategorySuggestions"), ()=> currentCategories()[el("editType").value] || []);

/* ---------- Вкладки ---------- */

el("tabBtnAdd").onclick = ()=>{
  el("tabBtnAdd").classList.add("active"); el("tabBtnEntries").classList.remove("active");
  el("tabAdd").style.display = ""; el("tabEntries").style.display = "none";
};
el("tabBtnEntries").onclick = ()=>{
  el("tabBtnEntries").classList.add("active"); el("tabBtnAdd").classList.remove("active");
  el("tabEntries").style.display = ""; el("tabAdd").style.display = "none";
};

/* ---------- Тип операции ---------- */

function setType(type){
  state.type = type;
  el("btnIncome").classList.toggle("active", type==="income");
  el("btnExpense").classList.toggle("active", type==="expense");
  el("btnTransfer").classList.toggle("active", type==="transfer");

  const isTransfer = type === "transfer";
  el("normalFields").style.display = isTransfer ? "none" : "";
  el("transferFields").style.display = isTransfer ? "" : "none";
  el("photoFieldWrapper").style.display = isTransfer ? "none" : "";
  el("currencyPill").style.display = isTransfer ? "none" : "";

  if(isTransfer){
    el("btnSubmit").className = "submit-btn transfer";
    el("btnSubmit").textContent = "Перевести";
    fillTransferWallets();
  } else {
    el("categoryInput").value = "";
    el("btnSubmit").className = "submit-btn " + type;
    el("btnSubmit").textContent = type==="income" ? "Добавить приход" : "Добавить расход";
  }
  updateCurrencyPillValue();
}

el("btnIncome").onclick = ()=>{ setType("income"); el("title").focus(); };
el("btnExpense").onclick = ()=>{ setType("expense"); el("title").focus(); };
el("btnTransfer").onclick = ()=> setType("transfer");

function setCurrencyPill(pillEl, code){
  pillEl.textContent = currencySymbol(code) + " " + code;
  pillEl.dataset.code = code;
}
function updateCurrencyPillValue(){
  let code = "RUB";
  if(state.type === "transfer"){
    const fromName = el("transferFrom").value;
    const w = currentWallets().find(w=>w.name===fromName);
    if(w) code = w.currency;
  } else if(state.manualCurrency){
    code = state.manualCurrency;
  } else {
    const w = currentWallets().find(w=>w.name===state.selectedWallet);
    if(w) code = w.currency;
  }
  setCurrencyPill(el("currencyPill"), code);
}
el("currencyPill").onclick = ()=>{
  if(state.type === "transfer") return;
  const idx = CURRENCIES.indexOf(el("currencyPill").dataset.code);
  const next = CURRENCIES[(idx+1) % CURRENCIES.length];
  state.manualCurrency = next;
  setCurrencyPill(el("currencyPill"), next);
};

function fillTransferWallets(){
  const fromSelect = el("transferFrom");
  fillWalletOptions(fromSelect);
  if(state.selectedWallet) fromSelect.value = state.selectedWallet;
  updateTransferToOptions();
  fromSelect.onchange = ()=>{ updateTransferToOptions(); updateCurrencyPillValue(); };
}
function updateTransferToOptions(){
  const fromName = el("transferFrom").value;
  const fromWallet = currentWallets().find(w=>w.name===fromName);
  const currency = fromWallet ? fromWallet.currency : null;
  const options = currentWallets().filter(w=> w.name!==fromName && (!currency || w.currency===currency));
  el("transferTo").innerHTML = options.length
    ? options.map(w=>`<option value="${escapeHtml(w.name)}">${escapeHtml(w.name)}</option>`).join("")
    : `<option value="">Нет подходящих кошельков</option>`;
}

/* ---------- Имя сотрудника ---------- */

function updateEmployeeDisplay(){
  el("employeeDisplay").innerHTML = state.employeeName
    ? escapeHtml(state.employeeName) + '<span class="hint">нажмите, чтобы сменить</span>'
    : "Сотрудник";
}
function openEmployeeModal(mandatory){
  el("employeeModalTitle").textContent = mandatory ? "Как вас зовут?" : "Сменить сотрудника";
  el("employeeNameInput").value = state.employeeName || "";
  el("btnEmployeeCancel").style.display = mandatory ? "none" : "inline";
  el("employeeBackdrop").style.display = "flex";
}
el("employeeDisplay").onclick = ()=> openEmployeeModal(false);
el("btnEmployeeCancel").onclick = ()=>{ el("employeeBackdrop").style.display = "none"; };
el("btnEmployeeSave").onclick = ()=>{
  const name = el("employeeNameInput").value.trim();
  if(!name){ showToast("Введите имя"); return; }
  state.employeeName = name;
  localStorage.setItem(EMPLOYEE_KEY, name);
  updateEmployeeDisplay();
  el("employeeBackdrop").style.display = "none";
};

/* ---------- Кошельки ---------- */

function renderWalletStrip(){
  const wallets = currentWallets();
  if(!state.selectedWallet || !wallets.some(w=>w.name===state.selectedWallet)){
    state.selectedWallet = wallets[0] ? wallets[0].name : null;
  }
  const wrap = el("walletStrip");
  wrap.innerHTML = wallets.map(w=>{
    const selected = state.selectedWallet === w.name ? "selected" : "";
    return `<div class="wallet-chip ${selected}" data-wallet="${escapeHtml(w.name)}">
      <div class="wname">${escapeHtml(w.name)}</div>
    </div>`;
  }).join("");
  wrap.querySelectorAll(".wallet-chip").forEach(node=>{
    node.onclick = ()=>{
      state.selectedWallet = node.getAttribute("data-wallet");
      localStorage.setItem(WALLET_KEY, state.selectedWallet);
      state.manualCurrency = null;
      renderWalletStrip();
      updateCurrencyPillValue();
    };
  });
}

/* ---------- Фото: камера ---------- */

function bindPhotoButtons(){
  el("btnCamera").onclick = ()=> openCamera("add");
  el("btnGallery").onclick = ()=> el("galleryInput").click();
}
bindPhotoButtons();

el("galleryInput").onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=> setPhoto(reader.result, file.type);
  reader.readAsDataURL(file);
};
el("editGalleryInput").onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    state.editPhoto = { dataUrl: reader.result, mime: file.type };
    state.editPhotoUrl = null;
    state.editPhotoChanged = true;
    renderEditPhotoArea();
  };
  reader.readAsDataURL(file);
};

async function openCamera(target){
  state.cameraTarget = target || "add";
  el("cameraOverlay").style.display = "flex";
  try{
    state.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: state.facingMode }, audio:false });
    el("cameraVideo").srcObject = state.stream;
  }catch(err){
    showToast("Нет доступа к камере");
    closeCamera();
  }
}
function closeCamera(){
  el("cameraOverlay").style.display = "none";
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
}
el("btnCameraClose").onclick = closeCamera;
el("btnCameraSwitch").onclick = ()=>{
  state.facingMode = state.facingMode === "environment" ? "user" : "environment";
  const target = state.cameraTarget;
  closeCamera(); openCamera(target);
};
el("btnShutter").onclick = ()=>{
  const video = el("cameraVideo");
  const canvas = el("captureCanvas");
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
  if(state.cameraTarget === "edit"){
    state.editPhoto = { dataUrl, mime:"image/jpeg" };
    state.editPhotoUrl = null;
    state.editPhotoChanged = true;
    renderEditPhotoArea();
  } else {
    setPhoto(dataUrl, "image/jpeg");
  }
  closeCamera();
};

function setPhoto(dataUrl, mime){
  state.photo = {dataUrl, mime};
  renderPhotoArea();
}
function renderPhotoArea(){
  const area = el("photoArea");
  if(state.photo){
    area.innerHTML = `
      <div class="photo-preview">
        <img src="${state.photo.dataUrl}">
        <button type="button" class="photo-remove" id="btnRemovePhoto">✕</button>
      </div>`;
    el("btnRemovePhoto").onclick = ()=>{ state.photo = null; renderPhotoArea(); };
  } else {
    area.innerHTML = `
      <div class="photo-field">
        <button type="button" class="photo-btn" id="btnCamera">Камера</button>
        <button type="button" class="photo-btn" id="btnGallery">Галерея</button>
      </div>`;
    bindPhotoButtons();
  }
}
function renderEditPhotoArea(){
  const area = el("editPhotoArea");
  const previewSrc = state.editPhoto ? state.editPhoto.dataUrl : state.editPhotoUrl;
  if(previewSrc){
    area.innerHTML = `
      <div class="photo-preview">
        <img src="${previewSrc}">
        <button type="button" class="photo-remove" id="btnEditRemovePhoto">✕</button>
      </div>`;
    el("btnEditRemovePhoto").onclick = ()=>{
      state.editPhoto = null; state.editPhotoUrl = null; state.editPhotoChanged = true;
      renderEditPhotoArea();
    };
  } else {
    area.innerHTML = `
      <div class="photo-field">
        <button type="button" class="photo-btn" id="btnEditCamera">Камера</button>
        <button type="button" class="photo-btn" id="btnEditGallery">Галерея</button>
      </div>`;
    el("btnEditCamera").onclick = ()=> openCamera("edit");
    el("btnEditGallery").onclick = ()=> el("editGalleryInput").click();
  }
}

/* ---------- Хранение ---------- */

function loadEntries(){ try{ state.entries = JSON.parse(localStorage.getItem("dds_entries")||"[]"); }catch(e){ state.entries=[]; } }
function saveEntries(){ localStorage.setItem("dds_entries", JSON.stringify(state.entries)); }
function loadCategoriesCache(){ try{ const c = JSON.parse(localStorage.getItem("dds_categories_cache")||"null"); if(c) state.categories=c; }catch(e){} }
function saveCategoriesCache(){ if(state.categories) localStorage.setItem("dds_categories_cache", JSON.stringify(state.categories)); }
function loadWalletsCache(){ try{ const w = JSON.parse(localStorage.getItem("dds_wallets_cache")||"null"); if(w) state.wallets=w; }catch(e){} }
function saveWalletsCache(){ if(state.wallets) localStorage.setItem("dds_wallets_cache", JSON.stringify(state.wallets)); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- Отправка на сервер ---------- */

async function sendToServer(payload){
  if(!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_") === 0) throw new Error("no_url");
  const body = Object.assign({ token: API_TOKEN }, payload);
  await fetch(SCRIPT_URL, {
    method:"POST", mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  return { ok:true };
}

async function fetchFromServer(){
  const url = SCRIPT_URL + (SCRIPT_URL.indexOf("?")===-1 ? "?" : "&") + "action=bootstrap&token=" + encodeURIComponent(API_TOKEN) + "&_=" + Date.now();
  const res = await fetch(url, { method:"GET" });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "server_error");
  return data;
}

function mapRemoteRow(r){
  return {
    id: String(r.id), timestamp: r.timestamp,
    type: (r.type === "Приход" || r.type === "Доход") ? "income" : "expense",
    employee: r.employee||"", title: r.title||"", category: r.category||"",
    wallet: r.wallet||"", currency: r.currency||"RUB",
    amount: Number(r.amount)||0, comment: r.comment||"",
    photo: null, photoUrl: r.photoUrl||null, transferId: r.transferId||null,
    status: "synced"
  };
}

function reconcileWithRemote(data){
  if(data.categories){
    state.categories = data.categories;
    saveCategoriesCache();
  }
  if(data.wallets){
    state.wallets = data.wallets;
    saveWalletsCache();
  }
  if(typeof data.totalCount === "number") state.totalCount = data.totalCount;

  if(data.rows){
    const remoteEntries = data.rows.map(mapRemoteRow);
    const remoteIds = new Set(remoteEntries.map(e=>e.id));
    const localOnly = state.entries.filter(e => !remoteIds.has(e.id) && !e.deleted && e.status !== "synced");
    localOnly.forEach(e=>{
      if(e.status === "pending" && e.sentAt && (Date.now() - e.sentAt) > UNCONFIRMED_TIMEOUT_MS){
        e.status = "error";
        if(state.pendingStatusEntryId === e.id){
          setSyncStatus("Не отправлено — сохранено локально", "error");
          el("btnRetry").style.display = "inline";
          state.pendingStatusEntryId = null;
        }
      }
    });
    if(state.pendingStatusEntryId && remoteIds.has(state.pendingStatusEntryId)){
      setSyncStatus("Сохранено", "ok");
      state.pendingStatusEntryId = null;
    }
    state.entries = [...localOnly, ...remoteEntries].sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
    saveEntries();
    if(state.entries.some(e=>e.status==="error")) el("btnRetry").style.display="inline";
  }
  renderWalletStrip();
  renderEntries();
  updateCurrencyPillValue();
}

function updateSyncMetaTimestamp(){
  const time = "Обновлено " + new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const count = state.totalCount != null ? " · всего записей: " + state.totalCount.toLocaleString("ru-RU") : "";
  el("syncMeta").textContent = time + count;
}

async function refreshFromServer(manual){
  if(state.refreshing) return;
  state.refreshing = true;
  try{
    const data = await fetchFromServer();
    reconcileWithRemote(data);
    updateSyncMetaTimestamp();
  }catch(err){
    el("syncMeta").textContent = "Не удалось обновить с сервера — показаны локальные данные";
  }
  state.refreshing = false;
}
el("btnRefresh").onclick = ()=> refreshFromServer(true);

/* ---------- Добавление записи ---------- */

function validateForm(){
  if(!state.employeeName){ openEmployeeModal(true); return false; }
  if(state.type === "transfer"){
    const from = el("transferFrom").value;
    const to = el("transferTo").value;
    if(!from || !to){ showToast("Выберите оба кошелька"); return false; }
    if(from === to){ showToast("Кошельки должны отличаться"); return false; }
    const amt = parseFloat(el("amount").value);
    if(!amt || amt<=0){ showToast("Введите сумму"); return false; }
    return true;
  }
  if(!state.selectedWallet){ showToast("Выберите кошелёк"); return false; }
  if(!el("title").value.trim()){ showToast("Укажите наименование"); return false; }
  const amountVal = parseFloat(el("amount").value);
  if(!amountVal || amountVal <= 0){ showToast("Введите сумму"); return false; }
  return true;
}

async function submitEntry(){
  if(!validateForm()) return;
  if(state.type === "transfer"){ await submitTransfer(); return; }

  const currency = el("currencyPill").dataset.code || "RUB";
  const entry = {
    id: uid(), timestamp: new Date().toISOString(), type: state.type,
    employee: state.employeeName, title: el("title").value.trim(),
    category: el("categoryInput").value.trim(), wallet: state.selectedWallet, currency,
    amount: parseFloat(el("amount").value), comment: el("comment").value.trim(),
    photo: state.photo ? state.photo.dataUrl : null, photoUrl: null, status: "pending"
  };

  state.entries.unshift(entry);
  saveEntries(); renderEntries();

  el("title").value=""; el("categoryInput").value=""; el("amount").value=""; el("comment").value="";
  state.photo = null; renderPhotoArea();
  state.manualCurrency = null; updateCurrencyPillValue();

  await syncEntry(entry);
  refreshFromServer(false);
}

async function submitTransfer(){
  const fromName = el("transferFrom").value;
  const toName = el("transferTo").value;
  const wallet = currentWallets().find(w=>w.name===fromName);
  const currency = wallet ? wallet.currency : "RUB";
  const amount = parseFloat(el("amount").value);
  const comment = el("comment").value.trim();
  const transferId = uid();
  const ts = new Date().toISOString();

  const outEntry = { id: transferId+"-out", timestamp: ts, type:"expense", employee: state.employeeName,
    title:"Перевод → "+toName, category:"Перемещение", wallet: fromName, currency,
    amount, comment, photo:null, photoUrl:null, status:"pending", transferId };
  const inEntry = { id: transferId+"-in", timestamp: ts, type:"income", employee: state.employeeName,
    title:"Перевод ← "+fromName, category:"Перемещение", wallet: toName, currency,
    amount, comment, photo:null, photoUrl:null, status:"pending", transferId };

  state.entries.unshift(outEntry, inEntry);
  saveEntries(); renderEntries();
  el("amount").value=""; el("comment").value="";

  await sendTransfer(transferId, fromName, toName, amount, comment, ts, currency, outEntry, inEntry);
  refreshFromServer(false);
}

async function sendTransfer(transferId, fromName, toName, amount, comment, ts, currency, outEntry, inEntry){
  setSyncStatus("Отправка перевода...", "pending");
  try{
    await sendToServer({ action:"transfer", id:transferId, fromWallet:fromName, toWallet:toName, amount, comment, employee:state.employeeName, timestamp: ts, currency });
    outEntry.status = "pending"; inEntry.status = "pending";
    outEntry.sentAt = Date.now(); inEntry.sentAt = Date.now();
    state.pendingStatusEntryId = outEntry.id;
    setSyncStatus("Отправлено, ждём подтверждения", "pending");
  }catch(err){
    outEntry.status = "error"; inEntry.status = "error";
    setSyncStatus("Не отправлено — сохранено локально", "error");
    el("btnRetry").style.display = "inline";
  }
  saveEntries(); renderEntries();
}

async function syncEntry(entry){
  setSyncStatus("Отправка...", "pending");
  try{
    await sendToServer({
      action:"add", id: entry.id, timestamp: entry.timestamp, type: entry.type,
      employee: entry.employee, title: entry.title, category: entry.category,
      wallet: entry.wallet, currency: entry.currency, amount: entry.amount, comment: entry.comment,
      transferId: entry.transferId || null,
      photoBase64: entry.photo ? entry.photo.split(",")[1] : null,
      photoMime: entry.photo ? entry.photo.split(";")[0].split(":")[1] : null
    });
    entry.status = "pending";
    entry.sentAt = Date.now();
    state.pendingStatusEntryId = entry.id;
    setSyncStatus("Отправлено, ждём подтверждения", "pending");
  }catch(err){
    entry.status = "error";
    state.pendingStatusEntryId = entry.id;
    setSyncStatus("Не отправлено — сохранено локально", "error");
    el("btnRetry").style.display = "inline";
  }
  saveEntries();
  renderEntries();
}

function retryPending(){
  const pending = state.entries.filter(e=> e.status !== "synced" && !e.deleted);
  if(pending.length === 0){ el("btnRetry").style.display="none"; return; }
  const transferGroups = {};
  pending.forEach(e=>{
    if(e.transferId){ (transferGroups[e.transferId] = transferGroups[e.transferId]||[]).push(e); }
    else { syncEntry(e).then(()=> refreshFromServer(false)); }
  });
  Object.keys(transferGroups).forEach(tid=>{
    const legs = transferGroups[tid];
    const out = legs.find(l=>l.id.endsWith("-out"));
    const inn = legs.find(l=>l.id.endsWith("-in"));
    if(out && inn){
      sendTransfer(tid, out.wallet, inn.wallet, out.amount, out.comment, out.timestamp, out.currency, out, inn)
        .then(()=> refreshFromServer(false));
    }
  });
}
el("btnRetry").onclick = retryPending;

function setSyncStatus(text, cls){
  const s = el("syncStatus");
  s.textContent = text;
  s.className = "sync-status " + (cls||"");
  if(cls === "ok"){ setTimeout(()=>{ if(s.textContent===text) s.textContent=""; }, 2000); }
}

el("btnSubmit").onclick = submitEntry;

/* ---------- Отрисовка списка записей ---------- */

function fmt(n){ return Math.round(n).toLocaleString("ru-RU"); }

function renderEntries(){
  const list = el("entriesList");
  const visible = state.entries.filter(e=>!e.deleted).slice(0, 150);
  if(visible.length===0){
    list.innerHTML = `<div class="empty">Пока нет записей</div>`;
    return;
  }
  list.innerHTML = visible.map(e=>{
    const dot = e.status==="error" ? `<span class="dot error"></span>` : e.status==="pending" ? `<span class="dot pending"></span>` : "";
    const d = new Date(e.timestamp);
    const dateStr = d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    const metaStr = [dateStr, e.employee, e.wallet].filter(Boolean).join(" · ");
    return `<div class="entry ${e.type}" data-id="${e.id}">
      <div class="stripe"></div>
      <div class="info">
        <div class="title">${escapeHtml(e.title || e.category)}${dot}</div>
        <div class="cat">${escapeHtml(e.category)}</div>
        <div class="meta">${escapeHtml(metaStr)}</div>
      </div>
      <div class="amount">${e.type==="expense"?"−":"+"}${fmt(e.amount)} ${currencySymbol(e.currency)}</div>
    </div>`;
  }).join("");

  list.querySelectorAll(".entry").forEach(node=>{
    node.onclick = ()=> openEditModal(node.getAttribute("data-id"));
  });
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ---------- Редактирование / удаление ---------- */

function openEditModal(id){
  const entry = state.entries.find(e=>e.id===id);
  if(!entry) return;
  state.editingId = id;
  const isTransfer = !!entry.transferId;

  el("editType").value = entry.type;
  el("editType").disabled = isTransfer;
  el("editTitle").value = entry.title || "";

  if(isTransfer){
    el("editCategoryInput").value = "Перемещение";
    el("editCategoryInput").disabled = true;
    el("editWallet").innerHTML = `<option value="${escapeHtml(entry.wallet)}">${escapeHtml(entry.wallet)}</option>`;
    el("editWallet").disabled = true;
  } else {
    el("editCategoryInput").value = entry.category || "";
    el("editCategoryInput").disabled = false;
    fillWalletOptions(el("editWallet"));
    el("editWallet").value = entry.wallet || "";
    el("editWallet").disabled = false;
  }

  setCurrencyPill(el("editCurrencyPill"), entry.currency || "RUB");
  el("editCurrencyPill").disabled = isTransfer;
  el("editCurrencyPill").onclick = isTransfer ? null : ()=>{
    const idx = CURRENCIES.indexOf(el("editCurrencyPill").dataset.code);
    setCurrencyPill(el("editCurrencyPill"), CURRENCIES[(idx+1) % CURRENCIES.length]);
  };

  el("editAmount").value = entry.amount;
  el("editComment").value = entry.comment || "";
  state.editPhoto = entry.photo ? { dataUrl: entry.photo, mime: null } : null;
  state.editPhotoUrl = (!entry.photo && entry.photoUrl) ? entry.photoUrl : null;
  state.editPhotoChanged = false;
  renderEditPhotoArea();
  el("editModalBackdrop").style.display = "flex";
}
el("btnEditCancel").onclick = ()=>{ el("editModalBackdrop").style.display = "none"; };

el("btnEditSave").onclick = async ()=>{
  const entry = state.entries.find(e=>e.id===state.editingId);
  if(!entry) return;
  entry.type = el("editType").value;
  entry.title = el("editTitle").value.trim();
  entry.category = el("editCategoryInput").value.trim();
  entry.wallet = el("editWallet").value;
  entry.currency = el("editCurrencyPill").dataset.code;
  entry.amount = parseFloat(el("editAmount").value) || entry.amount;
  entry.comment = el("editComment").value.trim();
  entry.status = "pending";

  const payload = { action:"edit", id:entry.id, type:entry.type, employee:entry.employee, title:entry.title,
    category:entry.category, wallet:entry.wallet, currency:entry.currency, amount:entry.amount, comment:entry.comment };
  if(state.editPhotoChanged){
    if(state.editPhoto){
      payload.photoBase64 = state.editPhoto.dataUrl.split(",")[1];
      payload.photoMime = state.editPhoto.mime || state.editPhoto.dataUrl.split(";")[0].split(":")[1];
      entry.photo = state.editPhoto.dataUrl; entry.photoUrl = null;
    } else {
      payload.removePhoto = true; entry.photo = null; entry.photoUrl = null;
    }
  }

  saveEntries(); renderEntries();
  el("editModalBackdrop").style.display = "none";
  try{
    await sendToServer(payload);
    entry.status = "pending"; entry.sentAt = Date.now();
  }catch(e){ entry.status="error"; el("btnRetry").style.display="inline"; }
  saveEntries(); renderEntries();
  refreshFromServer(false);
};

el("btnEditDelete").onclick = ()=>{
  const entry = state.entries.find(e=>e.id===state.editingId);
  el("confirmDeleteText").textContent = entry && entry.transferId
    ? "Удалятся обе стороны перевода. Действие нельзя отменить."
    : "Это действие нельзя отменить.";
  state.deletingId = state.editingId;
  el("editModalBackdrop").style.display = "none";
  el("confirmDeleteBackdrop").style.display = "flex";
};
el("btnConfirmDeleteCancel").onclick = ()=>{ el("confirmDeleteBackdrop").style.display = "none"; state.deletingId = null; };
el("btnConfirmDeleteOk").onclick = async ()=>{
  const entry = state.entries.find(e=>e.id===state.deletingId);
  el("confirmDeleteBackdrop").style.display = "none";
  if(!entry) return;
  if(entry.transferId){
    state.entries.forEach(e=>{ if(e.transferId === entry.transferId) e.deleted = true; });
  } else {
    entry.deleted = true;
  }
  saveEntries(); renderEntries();
  try{
    await sendToServer({ action:"delete", id:entry.id });
  }catch(e){ /* при сбое запись снова появится при следующей сверке, если удаление не прошло */ }
  state.deletingId = null;
  refreshFromServer(false);
};

function showToast(text){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

/* ---------- Инициализация ---------- */

loadCategoriesCache();
loadWalletsCache();
state.selectedWallet = localStorage.getItem(WALLET_KEY) || (currentWallets()[0] && currentWallets()[0].name) || null;
setType("income");
loadEntries();
renderWalletStrip();
renderEntries();
if(state.entries.some(e=>e.status!=="synced")) el("btnRetry").style.display="inline";

state.employeeName = localStorage.getItem(EMPLOYEE_KEY) || "";
updateEmployeeDisplay();
if(!state.employeeName) openEmployeeModal(true);

el("title").addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); el("amount").focus(); } });
el("amount").addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); el("amount").blur(); submitEntry(); } });

refreshFromServer(false);
setInterval(()=> refreshFromServer(false), REFRESH_INTERVAL_MS);
</script>
